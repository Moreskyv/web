{% extends 'base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
    <h2>Удаление группы</h2>
    <p>Вы уверены, что хотите удалить группу "{{ group.name }}"?</p>
    <p>Это действие необратимо.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'group_detail' group_id=group.id %}">Отмена</a>
    </form>
{% endblock %}
